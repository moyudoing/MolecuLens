<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.55" stop-color="#1D7BF0"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.46" stop-color="#FFFFFF" stop-opacity="0.00"/>
      <stop offset="1" stop-color="#001A33" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" rx="112" fill="url(#gloss)"/>

  <!-- 透镜：白环 + 极淡内圈（32px 下只剩白环，仍可读作镜头） -->
  <circle cx="256" cy="244" r="148" fill="none" stroke="#FFFFFF" stroke-opacity="0.98" stroke-width="26"/>
  <circle cx="256" cy="244" r="121" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4"/>

  <!-- 分子：中心原子 + 两个配体，键角 120° -->
  <g stroke="#FFFFFF" stroke-width="18" stroke-linecap="round">
    <line x1="256" y1="240" x2="206" y2="290"/>
    <line x1="256" y1="240" x2="306" y2="290"/>
  </g>
  <circle cx="256" cy="234" r="34" fill="#FFFFFF"/>
  <circle cx="203" cy="293" r="25" fill="#FFFFFF"/>
  <circle cx="309" cy="293" r="25" fill="#FFFFFF"/>
</svg>
