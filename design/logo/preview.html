<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#F5F7FB;font-family:"Segoe UI","Microsoft YaHei",sans-serif}
  .row{display:flex;gap:28px;padding:28px 32px;justify-content:center}
  .card{width:300px;background:#fff;border:1px solid #E2E8F0;border-radius:16px;padding:16px;
        box-shadow:0 6px 20px rgba(15,23,42,.06)}
  .card img{display:block;width:252px;height:252px;margin:0 auto 10px}
  .t{font-size:15px;font-weight:600;color:#1F2937;text-align:center}
  .s{font-size:12px;color:#64748B;text-align:center;margin-top:4px}
  .small{display:flex;gap:14px;align-items:flex-end;justify-content:center;padding:0 32px 26px}
  .small img{border-radius:8px;border:1px solid #E2E8F0}
</style></head>
<body>
  <div class="row">
    <div class="card"><img src="a-lens.svg"><div class="t">A · 透镜 + 分子</div>
      <div class="s">透镜=观察，分子=对象；蓝青渐变，小尺寸仍可辨</div></div>
    <div class="card"><img src="b-hex.svg"><div class="t">B · 六边形孔径</div>
      <div class="s">暗底高对比，像光学元件；适合深色主题/暗底启动图</div></div>
    <div class="card"><img src="c-monogram.svg"><div class="t">C · M 字标</div>
      <div class="s">键线构成字母 M，与 Lens 圆环合一；浅底印刷感</div></div>
  </div>
  <div class="small">
    <img src="a-lens.svg" width="96" height="96">
    <img src="a-lens.svg" width="48" height="48">
    <img src="a-lens.svg" width="32" height="32">
    <img src="a-lens.svg" width="16" height="16">
  </div>
</body></html>
