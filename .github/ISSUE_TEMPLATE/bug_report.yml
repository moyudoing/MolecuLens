name: "🐛 Bug report / 缺陷报告"
description: Crash, wrong geometry, wrong colour, unreadable file, exporter or CLI problem.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Two things make a report fixable: **a minimal reproducing input**
        (the structure / trajectory / cube file, or a command line) and **the exact build** you ran.

        谢谢反馈。能修的报告通常都有两样东西：**最小可复现输入**（结构 / 轨迹 / cube 文件，或一条命令）
        与**确切的构建版本**。

  - type: textarea
    id: what-happened
    attributes:
      label: What happens / 现象
      description: What you see, and what is wrong about it.
      placeholder: |
        e.g. QuickSurf surface flickers on every trajectory frame, and the frame counter jumps back.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Exact commands or UI clicks. If a file is needed, say how large it is and attach it if possible.
      placeholder: |
        1. moleculens_app data/md.gro
        2. Load md.xtc, press play
        3. ...
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour / 期望行为
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area / 模块
      options:
        - Rendering / 渲染（GPU）
        - Ray tracing / 光追（CPU）
        - Representations & colouring / 表示与配色
        - GUI / workbench / 界面
        - Trajectory & timeline / 轨迹与时间轴
        - CLI / 命令行
        - Import & export / 导入导出
        - Build & packaging / 构建与打包
        - Documentation / 文档
    validations:
      required: true

  - type: input
    id: build
    attributes:
      label: Build / 构建
      description: Version or commit, Debug or Release, and how you built it.
      placeholder: "v2.13, Release, MSVC 2022, ctest all green"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system / 操作系统
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS
        - Other / 其他
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU and Vulkan version / 显卡与 Vulkan 版本
      description: Output of `vulkaninfo --summary`, or the GPU model and driver version.
      placeholder: "RTX 3060, driver 551.23, Vulkan 1.3.275"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / 日志
      description: Console output or `logs/` entries around the failure. spdlog lines and assert messages help.
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Screenshots or extra context / 截图或补充
      description: Drag images here. For rendering issues, a screenshot with the expected result is ideal.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist / 自查
      options:
        - label: I searched existing issues and the known-issue list.
          required: true
        - label: I can share the input file (or a trimmed version of it) needed to reproduce.
          required: false
