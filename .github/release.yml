# GitHub Release 自动分类（按 PR 标签归类变更列表）
# 依赖机器人的 PR 不进发布说明；最后一个 "*" 分类必须保留，否则打不上标签的 PR 会丢失。
changelog:
  exclude:
    authors:
      - dependabot
      - dependabot[bot]
  categories:
    - title: Features / 新功能
      labels:
        - feature
        - enhancement
    - title: Fixes / 修复
      labels:
        - bug
        - fix
    - title: Performance / 性能
      labels:
        - performance
    - title: Documentation / 文档
      labels:
        - documentation
        - docs
    - title: Build & CI / 构建与持续集成
      labels:
        - build
        - ci
        - dependencies
    - title: Other Changes / 其它
      labels:
        - "*"
